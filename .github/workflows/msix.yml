name: MSIX (Microsoft Store)

# Avvio manuale: crea il pacchetto MSIX per Partner Center e lo verifica con il
# Windows App Certification Kit (gli stessi controlli della certificazione Store).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione app (es. 0.2.5)'
        required: true
      display_name:
        description: 'Nome riservato in Partner Center'
        required: true
        default: 'VersoCon'

env:
  MSIX_NAME: HikariHasegawa.Versocon
  MSIX_PUBLISHER: CN=5D37776B-7FD8-4952-8F23-6A044902DAFD
  MSIX_PUBLISHER_DISPLAY: Hikari Hasegawa

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps + PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pyinstaller

      - name: Build app (PyInstaller)
        shell: pwsh
        run: pyinstaller packaging\versacon.spec --noconfirm --clean

      - name: Build MSIX (unsigned, for Partner Center)
        shell: pwsh
        run: >
          python packaging/msix/build_msix.py --dist dist/Versocon --version "${{ inputs.version }}"
          --name "$env:MSIX_NAME" --publisher "$env:MSIX_PUBLISHER" --publisher-display "$env:MSIX_PUBLISHER_DISPLAY"
          --display-name "${{ inputs.display_name }}" --out "out/VersoCon-${{ inputs.version }}.msix"

      - name: Windows App Certification Kit (on a test-signed copy)
        shell: powershell
        run: |
          $sdk = 'C:\Program Files (x86)\Windows Kits\10'
          $signtool = (Get-ChildItem "$sdk\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          $appcert = "$sdk\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { throw "appcert.exe (WACK) non presente sul runner" }
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:MSIX_PUBLISHER -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath out\wack.cer | Out-Null
          Import-Certificate -FilePath out\wack.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Copy-Item "out\VersoCon-${{ inputs.version }}.msix" out\wack.msix
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint out\wack.msix
          if ($LASTEXITCODE) { throw "signtool fallito" }
          & $appcert reset
          & $appcert test -appxpackagepath "$PWD\out\wack.msix" -reportoutputpath "$PWD\out\wack-report.xml"
          [xml]$report = Get-Content out\wack-report.xml
          $overall = $report.REPORT.OVERALL_RESULT
          Write-Output "WACK OVERALL_RESULT: $overall"
          foreach ($t in $report.SelectNodes('//TEST')) {
            $res = $t.SelectSingleNode('RESULT').InnerText
            if ($res -and $res -ne 'PASS') {
              Write-Output ("[{0}] {1} (optional={2})" -f $res, $t.GetAttribute('NAME'), $t.GetAttribute('OPTIONAL'))
              foreach ($m in $t.SelectNodes('.//MESSAGE')) { Write-Output ("    - " + $m.GetAttribute('TEXT')) }
            }
          }
          # PASS e WARNING (solo test opzionali per le app desktop) sono accettati dallo Store; FAIL no.
          if ($overall -notin @('PASS', 'WARNING')) { throw "WACK: $overall" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msix-${{ inputs.version }}
          path: |
            out/VersoCon-*.msix
            out/wack-report.xml
